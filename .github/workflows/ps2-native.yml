name: PS2 native renderer

on:
  pull_request:
    paths:
      - "ps2/**"
      - ".github/workflows/ps2-native.yml"
  push:
    branches:
      - "feature/ps2-native-renderer"
    paths:
      - "ps2/**"
      - ".github/workflows/ps2-native.yml"

jobs:
  build-ee:
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build driver
        run: apk add --no-cache make

      - name: Toolchain versions
        run: |
          mips64r5900el-ps2-elf-gcc --version
          dvp-as --version || true

      - name: Build PS2 native target
        run: make -C ps2

      - name: Verify ELF
        run: |
          test -s ps2/ctr_ps2_renderer.elf
          mips64r5900el-ps2-elf-readelf -h ps2/ctr_ps2_renderer.elf
          ls -lh ps2/ctr_ps2_renderer.elf
          sha256sum ps2/ctr_ps2_renderer.elf

      - name: Upload PS2 ELF
        uses: actions/upload-artifact@v4
        with:
          name: ctr-ps2-native-elf
          path: ps2/ctr_ps2_renderer.elf
          if-no-files-found: error
